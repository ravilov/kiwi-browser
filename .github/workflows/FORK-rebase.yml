name: "FORKED KIWI: rebase on top of kiwi:master branch"

on:
  workflow_dispatch:

env:
  local: master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
        
      - name: Set up GitHub username
        run: |
          git config --global user.email "github@actions"
          git config --global user.name "Repository manager"

      - name: Add Kiwi repo as upstream
        run: |
          git remote add upstream ${{ vars.baseurl }}.git

      - name: Fetch Kiwi repo
        run: |
          git fetch upstream

      - name: Switch to fork
        run: |
          git checkout origin/${{ env.local }}

      - name: Rebase on top of Kiwi
        run: |
          git rebase upstream/${{ env.local }} --committer-date-is-author-date

      - name: Prepare new branch
        run: |
          git checkout -b ${{ env.local }}-new

      # This is done on purpose
      # See: https://redfin.engineering/git-rebasing-public-branches-works-much-better-than-youd-think-ecc9a115aea9
      - name: Push new branch
        run: |
          git push origin ${{ env.local }}-new:${{ env.local }} --force

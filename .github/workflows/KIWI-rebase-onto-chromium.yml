name: "KIWI: rebase on top of 'chromium' branch"

on:
  workflow_dispatch:

env:
  - local: master
  - remote: chromium

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
        
      - name: Set up GitHub username
        run: |
          git config --global user.email "github@actions"
          git config --global user.name "Repository manager"

      - name: Add Kiwi repo as upstream
        run: |
          git remote add upstream ${{ github.repositoryUrl }}

      - name: Fetch Kiwi repo
        run: |
          git fetch upstream

      - name: Switch to Chromium
        run: |
          git checkout origin/${{ env.remote }}

      - name: Rebase on top of Kiwi Chromium
        run: |
          git rebase upstream/${{ env.remote }} --committer-date-is-author-date

      - name: Push Chromium branch
        run: |
          git push origin origin/${{ env.remote }} HEAD:${{ env.remote }} --force

      - name: Fetch Kiwi branch
        run: |
          git fetch origin ${{ env.local }}

      - name: Switch to Kiwi
        run: |
          git checkout origin/${{ env.local }}

      - name: Rebase on top of kiwi:chromium
        run: |
          git rebase upstream/${{ env.remote }} --committer-date-is-author-date

      - name: Prepare new branch
        run: |
          git checkout -b ${{ env.local }}-new

      # This is done on purpose
      # See: https://redfin.engineering/git-rebasing-public-branches-works-much-better-than-youd-think-ecc9a115aea9
      - name: Pushing new branch
        run: |
          git push origin ${{ env.local }}-new:${{ env.local }} --force
